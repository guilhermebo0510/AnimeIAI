[package]
name = "aiai-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bridge local (loopback + token) entre o aiai-mcp/CLI e o AnimeIAI Studio: NDJSON/HTTP, discovery, ponte para a thread da UI e acoes de documento sobre a CoreSession"

[lib]
doctest = false
test = false

[dependencies]
aiai-core = { workspace = true }
aiai-anim = { workspace = true }
aiai-audio = { workspace = true }
aiai-fx = { workspace = true }
aiai-media = { workspace = true }
aiai-paint = { workspace = true }
aiai-render = { workspace = true }
aiai-tools = { workspace = true }
base64 = { workspace = true }
schemars = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
getrandom = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
base64 = { workspace = true }
