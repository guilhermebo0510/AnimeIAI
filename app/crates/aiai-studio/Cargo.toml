[package]
name = "aiai-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AnimeIAI Studio: UI nativa (egui + wgpu) do estudio de animacao 2D"

[lib]
name = "aiai_studio"
path = "src/lib.rs"

[[bin]]
name = "aiai-studio"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui_tiles = { workspace = true }
wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
crossbeam-channel = { workspace = true }
aiai-core = { workspace = true }
aiai-render = { workspace = true }
aiai-fx = { workspace = true }
aiai-bridge = { workspace = true }
aiai-paint = { workspace = true }
aiai-tools = { workspace = true }
aiai-audio = { workspace = true }
aiai-3d-core = { path = "../aiai-3d-core" }
aiai-3d-render = { path = "../aiai-3d-render" }
aiai-3d-model = { path = "../aiai-3d-model" }
aiai-3d-edit = { path = "../aiai-3d-edit" }
aiai-assets = { path = "../aiai-assets" }
glam = { workspace = true }
pollster = "1"
# dialogos nativos de abrir/salvar pasta de projeto (Arquivo > Abrir/Salvar como)
rfd = { version = "0.15", default-features = false }
# Rasterizacao dos icones SVG. Sem as features padrao: nao precisamos de texto nem de imagens raster dentro dos SVGs
# (evita fontdb/rustybuzz/memmap e deixa o build mais leve; a regra do workspace "resvg = 0.45" continua valendo).
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
# memoria do processo na barra de status (GetProcessMemoryInfo); 0.61.2 ja esta no Cargo.lock
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Media_Audio"] }

[dev-dependencies]
tempfile = "3"
