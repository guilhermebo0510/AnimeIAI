[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
# Versões alinhadas com C:\ANIGO (Cargo.lock de 2026-10-13): já compilam neste PC e permitem copiar código entre os projetos.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_tiles = { version = "0.17.1", default-features = false }
wgpu = "30.0.1"
glam = { version = "0.29", features = ["serde"] }
kurbo = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8.22"
uuid = { version = "1.26", features = ["v7", "serde"] }
blake3 = "1.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
base64 = "0.22"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
getrandom = "0.3"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.10"
resvg = "0.45"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
proptest = "1.5"

aiai-core = { path = "crates/aiai-core" }
aiai-paint = { path = "crates/aiai-paint" }
aiai-render = { path = "crates/aiai-render" }
aiai-anim = { path = "crates/aiai-anim" }
aiai-fx = { path = "crates/aiai-fx" }
aiai-audio = { path = "crates/aiai-audio" }
aiai-media = { path = "crates/aiai-media" }
aiai-guide3d = { path = "crates/aiai-guide3d" }
aiai-metrics = { path = "crates/aiai-metrics" }
aiai-bridge = { path = "crates/aiai-bridge" }

# Perfis definidos uma vez (mudar = recompilar tudo; ver lições 6–7). Dependências otimizadas mesmo em dev (UI fluida);
# código do projeto em opt-level 1.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
